manifestVersion: 1
id: serkan-openbot
name: OpenBot Server
tagline: Local-first multi-agent server for Codex, Claude and Grok
icon: https://raw.githubusercontent.com/serkanagdas/nodecast-umbrel-store/main/serkan-openbot/icon.svg
category: AI
version: "0.70.0"
port: 3010
description: >-
  OpenBot is a local-first multi-agent workspace that runs persistent
  AI teammates on Codex, Claude, Gemini and Grok. This package runs
  the headless OpenBot server as a background service on your umbrel.


  IMPORTANT — there is no web interface inside this app. After
  installing, sign in once from the umbrel terminal
  (docker exec -it serkan-openbot_server_1 openbot login), then use
  the OpenBot desktop/phone app or openbot.run/app with the same
  account and pick your umbrel server from the server list.

developer: Nightly Labs
website: https://github.com/nightly-labs/openbot
