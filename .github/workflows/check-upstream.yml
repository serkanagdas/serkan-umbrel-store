name: Check upstream updates

# Checks each packaged app's REGISTRY for the newest image tag (the source of
# truth is the registry, not GitHub releases — releases can run ahead of the
# published image, e.g. nodecast v2.2.1 with GHCR tags ending at 1.4.3).
# When a newer tag exists, opens (or updates) a PR bumping the compose image
# tag and the umbrel-app.yml version. Merge the PR and umbrelOS shows
# "Update available".

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # dir | registry type | registry path (image without tag) | prefix filter
          - dir: serkan-openbot
            registry: ghcr
            image: ghcr.io/nightly-labs/openbot
            path: nightly-labs/openbot
            prefix: "v"
          - dir: serkan-nodecast-tv
            registry: ghcr
            image: ghcr.io/technomancer702/nodecast-tv
            path: technomancer702/nodecast-tv
            prefix: ""
          - dir: serkan-stremio-server
            registry: dockerhub
            image: stremio/server
            path: stremio/server
            prefix: ""
          - dir: serkan-teamspeak
            registry: dockerhub
            image: teamspeak
            path: library/teamspeak
            prefix: ""
    steps:
      - name: Checkout store repo
        uses: actions/checkout@v4

      - name: Get newest image tag from registry
        id: upstream
        run: |
          PREFIX="${{ matrix.prefix }}"
          if [ "${{ matrix.registry }}" = "ghcr" ]; then
            TOKEN="$(curl -sSf "https://ghcr.io/token?scope=repository:${{ matrix.path }}:pull" | jq -r .token)"
            TAGS="$(curl -sSf -H "Authorization: Bearer $TOKEN" \
              "https://ghcr.io/v2/${{ matrix.path }}/tags/list?n=1000" | jq -r '.tags[]?')"
          else
            TAGS="$(curl -sSf "https://hub.docker.com/v2/repositories/${{ matrix.path }}/tags?page_size=100" \
              | jq -r '.results[]?.name')"
          fi

          # Keep semver-shaped tags only (optionally with the prefix), newest last
          LATEST="$(echo "$TAGS" | grep -E "^${PREFIX}[0-9]+\.[0-9]+\.[0-9]+$" \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"

          if [ -z "$LATEST" ]; then
            echo "No semver image tags found for ${{ matrix.path }}"; exit 1
          fi

          # Display version without the prefix (umbrel-app.yml style)
          VERSION="${LATEST#${PREFIX}}"
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Newest ${{ matrix.path }} image tag: $LATEST (version $VERSION)"

      - name: Compare with packaged version
        id: cmp
        run: |
          CURRENT="$(grep -m1 '^version:' ${{ matrix.dir }}/umbrel-app.yml | sed -E 's/^version:[[:space:]]*["'\'']?//;s/["'\''[:space:]]*$//')"
          echo "Packaged: $CURRENT / Newest image tag: ${{ steps.upstream.outputs.version }}"
          if [ "$CURRENT" = "${{ steps.upstream.outputs.version }}" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip note
        if: steps.cmp.outputs.update != 'true'
        run: echo "${{ matrix.dir }} is up to date (image ${{ steps.upstream.outputs.version }})"

      - name: Bump files
        if: steps.cmp.outputs.update == 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          sed -i "s|^version: .*|version: \"${VERSION}\"|" ${{ matrix.dir }}/umbrel-app.yml
          sed -i "s|^\(\s*image: ${{ matrix.image }}:\).*|\1${TAG}|" ${{ matrix.dir }}/docker-compose.yml
          # releaseNotes: single-line value on the line after "releaseNotes: >-"
          sed -i "/^releaseNotes: >-/{n;s/.*/  Upstream image release ${TAG}./}" ${{ matrix.dir }}/umbrel-app.yml

      - name: Create Pull Request
        id: pr
        if: steps.cmp.outputs.update == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          branch: "update/${{ matrix.dir }}"
          delete-branch: true
          title: "Update ${{ matrix.dir }} to ${{ steps.upstream.outputs.version }}"
          body: |
            Newest published image tag for `${{ matrix.path }}` is `${{ steps.upstream.outputs.tag }}`.

            Bumps:
            - `${{ matrix.dir }}/docker-compose.yml` image tag
            - `${{ matrix.dir }}/umbrel-app.yml` version + releaseNotes

            Auto-merged by the update workflow.
          commit-message: "chore(${{ matrix.dir }}): bump to ${{ steps.upstream.outputs.version }}"

      - name: Merge or enable auto-merge on the PR
        # Merges directly when no branch protection blocks it; falls back to
        # auto-merge when required checks/reviews are configured.
        if: steps.cmp.outputs.update == 'true' && steps.pr.outputs.pull-request-number != ''
        run: |
          PR="${{ steps.pr.outputs.pull-request-number }}"
          gh pr merge "$PR" --squash --delete-branch || \
            gh pr merge "$PR" --squash --auto --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}
